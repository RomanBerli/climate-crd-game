server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/climatedb}
    username: ${SPRING_DATASOURCE_USERNAME:climate_user}
    password: ${SPRING_DATASOURCE_PASSWORD:climate_password}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      # Beträge wie 30.7 nicht stillschweigend auf 30 abrunden, sondern ablehnen
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  admin-secret: ${APP_ADMIN_SECRET:}
  game:
    start-amount-chf: ${ENV_START_AMOUNT:6}
    group-size: ${ENV_GROUP_SIZE:6}
    total-rounds: ${ENV_TOTAL_ROUNDS:10}
    risk-level: ${ENV_RISK_LEVEL:0.90}
